<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Analytics Dashboard Mockup -->
  <g stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Window frame -->
    <rect x="40" y="40" width="432" height="432" rx="12"/>
    <line x1="40" y1="72" x2="472" y2="72"/>
    <circle cx="64" cy="56" r="4" fill="#2563EB" fill-opacity="0.3"/>
    <circle cx="80" cy="56" r="4" fill="#60A5FA" fill-opacity="0.3"/>
    <circle cx="96" cy="56" r="4" fill="#93C5FD" fill-opacity="0.3"/>
    
    <!-- Top stat cards -->
    <rect x="140" y="88" width="96" height="72" rx="8" stroke="#60A5FA" stroke-opacity="0.4"/>
    <rect x="248" y="88" width="96" height="72" rx="8" stroke="#60A5FA" stroke-opacity="0.4"/>
    <rect x="356" y="88" width="96" height="72" rx="8" stroke="#60A5FA" stroke-opacity="0.4"/>
    
    <!-- Main chart -->
    <rect x="140" y="176" width="200" height="140" rx="8" stroke="#93C5FD" stroke-opacity="0.3"/>
    <!-- Area chart -->
    <polyline points="160,290 190,270 220,275 250,250 280,240 310,235 340,240" stroke="#2563EB" stroke-opacity="0.5"/>
    <polyline points="160,290 190,280 220,285 250,270 280,265 310,260 340,262" stroke="#60A5FA" stroke-opacity="0.3"/>
    
    <!-- Donut chart -->
    <circle cx="408" cy="246" r="50" stroke="#93C5FD" stroke-opacity="0.3"/>
    <circle cx="408" cy="246" r="30" stroke="#60A5FA" stroke-opacity="0.4"/>
    <circle cx="408" cy="246" r="10" stroke="#2563EB" stroke-opacity="0.5"/>
    
    <!-- Bottom metrics -->
    <rect x="140" y="332" width="100" height="120" rx="8" stroke="#94A3B8" stroke-opacity="0.2"/>
    <rect x="252" y="332" width="100" height="120" rx="8" stroke="#94A3B8" stroke-opacity="0.2"/>
    <rect x="364" y="332" width="100" height="120" rx="8" stroke="#94A3B8" stroke-opacity="0.2"/>
    
    <!-- Sparklines in metric cards -->
    <polyline points="155,420 170,410 185,415 200,400 215,395 230,398" stroke="#2563EB" stroke-opacity="0.4" fill="none"/>
    <polyline points="267,420 282,405 297,410 312,390 327,385 342,388" stroke="#60A5FA" stroke-opacity="0.4" fill="none"/>
    <polyline points="379,420 394,415 409,400 424,395 439,390 454,392" stroke="#93C5FD" stroke-opacity="0.4" fill="none"/>
  </g>
</svg>
