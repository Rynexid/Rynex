  <rect x="172" y="100" width="108" height="52" rx="8" stroke="#2563EB" stroke-width="2.8" />
  <rect x="296" y="100" width="108" height="52" rx="8" stroke="#2563EB" stroke-width="2.8" />

  <!-- Row 2 - offset bricks -->
  <rect x="100" y="172" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />
  <rect x="224" y="172" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />
  <rect x="348" y="172" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />

  <!-- Row 3 - staggered bricks -->
  <rect x="48" y="244" width="108" height="52" rx="8" stroke="#2563EB" stroke-width="2.8" />
  <rect x="172" y="244" width="108" height="52" rx="8" stroke="#2563EB" stroke-width="2.8" />
  <rect x="296" y="244" width="108" height="52" rx="8" stroke="#2563EB" stroke-width="2.8" />

  <!-- Row 4 - offset bricks -->
  <rect x="100" y="316" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />
  <rect x="224" y="316" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />
  <rect x="348" y="316" width="108" height="52" rx="8" stroke="#60A5FA" stroke-width="2.8" />

  <!-- Horizontal line across middle -->
  <line x1="40" y1="218" x2="472" y2="218" stroke="#93C5FD" stroke-width="2.2" />

  <!-- Shield node in center -->
  <path
    d="M256 194 L278 204 Q284 208 284 214 L288 234 Q289 244 282 252 Q272 264 256 270 Q240 264 230 252 Q223 244 224 234 L228 214 Q228 208 234 204 Z"
    stroke="#2563EB"
    stroke-width="2.8"
  />
  <!-- Shield checkmark -->
  <polyline
    points="243 226 252 238 271 218"
    stroke="#93C5FD"
    stroke-width="3.2"
  />

  <!-- Blocked lines (stop at wall) - left side -->
  <line x1="28" y1="126" x2="88" y2="126" stroke="#93C5FD" stroke-width="2.2" />
  <!-- Block marker -->
  <line x1="88" y1="118" x2="88" y2="134" stroke="#94A3B8" stroke-width="2.8" />

  <!-- Blocked lines (stop at wall) - right side -->
  <line x1="424" y1="126" x2="484" y2="126" stroke="#93C5FD" stroke-width="2.2" />
  <line x1="424" y1="118" x2="424" y2="134" stroke="#94A3B8" stroke-width="2.8" />

  <!-- Blocked lines - left bottom -->
  <line x1="28" y1="342" x2="88" y2="342" stroke="#93C5FD" stroke-width="2.2" />
  <line x1="88" y1="334" x2="88" y2="350" stroke="#94A3B8" stroke-width="2.8" />

  <!-- Blocked lines - right bottom -->
  <line x1="424" y1="342" x2="484" y2="342" stroke="#93C5FD" stroke-width="2.2" />
  <line x1="424" y1="334" x2="424" y2="350" stroke="#94A3B8" stroke-width="2.8" />

  <!-- Passing lines through center shield - left -->
  <line x1="28" y1="218" x2="244" y2="218" stroke="#2563EB" stroke-width="2.2" />

  <!-- Passing lines through center shield - right -->
  <line x1="268" y1="218" x2="484" y2="218" stroke="#2563EB" stroke-width="2.2" />

  <!-- Arrow right -->
  <polyline points="468 210 484 218 468 226" stroke="#2563EB" stroke-width="2.2" />
</svg>
