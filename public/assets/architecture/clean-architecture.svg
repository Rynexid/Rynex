<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
  <!-- Presentation Layer -->
  <rect x="60" y="40" width="392" height="80" rx="12" ry="12" stroke="#2563EB"/>
  <line x1="160" y1="68" x2="352" y2="68" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="160" y1="84" x2="352" y2="84" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="180" y1="100" x2="332" y2="100" stroke="#2563EB" stroke-width="2.2"/>

  <!-- Connection: Presentation → Application -->
  <line x1="256" y1="120" x2="256" y2="164" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="256" cy="120" r="4" fill="#94A3B8" stroke="none"/>
  <circle cx="256" cy="164" r="4" fill="#94A3B8" stroke="none"/>

  <!-- Application Layer -->
  <rect x="60" y="164" width="392" height="80" rx="12" ry="12" stroke="#60A5FA"/>
  <line x1="160" y1="192" x2="352" y2="192" stroke="#60A5FA" stroke-width="2.2"/>
  <line x1="160" y1="208" x2="352" y2="208" stroke="#60A5FA" stroke-width="2.2"/>
  <line x1="180" y1="224" x2="332" y2="224" stroke="#60A5FA" stroke-width="2.2"/>

  <!-- Connection: Application → Domain -->
  <line x1="256" y1="244" x2="256" y2="288" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="256" cy="244" r="4" fill="#94A3B8" stroke="none"/>
  <circle cx="256" cy="288" r="4" fill="#94A3B8" stroke="none"/>

  <!-- Domain Layer -->
  <rect x="60" y="288" width="392" height="80" rx="12" ry="12" stroke="#93C5FD"/>
  <line x1="160" y1="316" x2="352" y2="316" stroke="#93C5FD" stroke-width="2.2"/>
  <line x1="160" y1="332" x2="352" y2="332" stroke="#93C5FD" stroke-width="2.2"/>
  <line x1="180" y1="348" x2="332" y2="348" stroke="#93C5FD" stroke-width="2.2"/>

  <!-- Connection: Domain → Infrastructure -->
  <line x1="256" y1="368" x2="256" y2="412" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="256" cy="368" r="4" fill="#94A3B8" stroke="none"/>
  <circle cx="256" cy="412" r="4" fill="#94A3B8" stroke="none"/>

  <!-- Infrastructure Layer -->
  <rect x="60" y="412" width="392" height="80" rx="12" ry="12" stroke="#94A3B8"/>
  <line x1="160" y1="440" x2="352" y2="440" stroke="#94A3B8" stroke-width="2.2"/>
  <line x1="160" y1="456" x2="352" y2="456" stroke="#94A3B8" stroke-width="2.2"/>
  <line x1="180" y1="472" x2="332" y2="472" stroke="#94A3B8" stroke-width="2.2"/>

  <!-- Side dependency arrows -->
  <path d="M470 80 L490 80 L490 204 L470 204" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
  <circle cx="470" cy="80" r="3.5" fill="#2563EB" stroke="none"/>
  <circle cx="470" cy="204" r="3.5" fill="#60A5FA" stroke="none"/>

  <path d="M42 80 L22 80 L22 452 L42 452" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
  <circle cx="42" cy="80" r="3.5" fill="#2563EB" stroke="none"/>
  <circle cx="42" cy="204" r="3.5" fill="#93C5FD" stroke="none"/>
  <circle cx="42" cy="452" r="3.5" fill="#94A3B8" stroke="none"/>
</svg>
