<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Software Architecture Hero -->
  <g stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left panel - code editor -->
    <rect x="40" y="60" width="180" height="392" rx="12"/>
    <line x1="40" y1="96" x2="220" y2="96"/>
    <circle cx="60" cy="78" r="4" fill="#2563EB" fill-opacity="0.3"/>
    <circle cx="76" cy="78" r="4" fill="#60A5FA" fill-opacity="0.3"/>
    <circle cx="92" cy="78" r="4" fill="#93C5FD" fill-opacity="0.3"/>
    <!-- Code lines -->
    <line x1="60" y1="120" x2="140" y2="120" stroke="#60A5FA" stroke-opacity="0.4"/>
    <line x1="60" y1="144" x2="180" y2="144" stroke="#93C5FD" stroke-opacity="0.3"/>
    <line x1="76" y1="168" x2="160" y2="168" stroke="#60A5FA" stroke-opacity="0.4"/>
    <line x1="76" y1="192" x2="190" y2="192" stroke="#94A3B8" stroke-opacity="0.3"/>
    <line x1="76" y1="216" x2="120" y2="216" stroke="#60A5FA" stroke-opacity="0.4"/>
    <line x1="60" y1="240" x2="170" y2="240" stroke="#93C5FD" stroke-opacity="0.3"/>
    <line x1="76" y1="264" x2="150" y2="264" stroke="#60A5FA" stroke-opacity="0.4"/>
    <line x1="60" y1="288" x2="130" y2="288" stroke="#94A3B8" stroke-opacity="0.3"/>
    
    <!-- Right panel - architecture diagram -->
    <rect x="252" y="60" width="220" height="180" rx="12"/>
    <rect x="272" y="80" width="180" height="36" rx="8" stroke="#2563EB" stroke-opacity="0.4"/>
    <rect x="272" y="128" width="180" height="36" rx="8" stroke="#60A5FA" stroke-opacity="0.4"/>
    <rect x="272" y="176" width="180" height="36" rx="8" stroke="#93C5FD" stroke-opacity="0.4"/>
    <!-- Connectors -->
    <line x1="362" y1="116" x2="362" y2="128" stroke-dasharray="4 3"/>
    <line x1="362" y1="164" x2="362" y2="176" stroke-dasharray="4 3"/>
    
    <!-- Bottom panel - database -->
    <rect x="252" y="268" width="220" height="184" rx="12"/>
    <ellipse cx="362" cy="310" rx="60" ry="16" stroke="#2563EB" stroke-opacity="0.4"/>
    <line x1="302" y1="310" x2="302" y2="400" stroke="#2563EB" stroke-opacity="0.4"/>
    <line x1="422" y1="310" x2="422" y2="400" stroke="#2563EB" stroke-opacity="0.4"/>
    <ellipse cx="362" cy="400" rx="60" ry="16" stroke="#2563EB" stroke-opacity="0.4"/>
    <ellipse cx="362" cy="355" rx="60" ry="16" stroke="#60A5FA" stroke-opacity="0.3"/>
    
    <!-- Connection lines between panels -->
    <line x1="220" y1="200" x2="252" y2="200" stroke-dasharray="6 4"/>
    <line x1="220" y1="350" x2="252" y2="350" stroke-dasharray="6 4"/>
    
    <!-- Node dots -->
    <circle cx="236" cy="200" r="4" fill="#2563EB" fill-opacity="0.5"/>
    <circle cx="236" cy="350" r="4" fill="#2563EB" fill-opacity="0.5"/>
    <circle cx="252" cy="200" r="4" fill="#60A5FA" fill-opacity="0.5"/>
    <circle cx="252" cy="350" r="4" fill="#60A5FA" fill-opacity="0.5"/>
  </g>
</svg>
