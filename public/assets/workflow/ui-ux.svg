<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
  <!-- Browser frame outer -->
  <rect x="80" y="60" width="352" height="392" rx="14" stroke="#2563EB" />

  <!-- Title bar -->
  <line x1="80" y1="108" x2="432" y2="108" stroke="#2563EB" />

  <!-- Title bar traffic light dots -->
  <circle cx="108" cy="84" r="5" fill="#EF4444" stroke="none" />
  <circle cx="128" cy="84" r="5" fill="#F59E0B" stroke="none" />
  <circle cx="148" cy="84" r="5" fill="#22C55E" stroke="none" />

  <!-- Browser address bar -->
  <rect x="200" y="76" width="180" height="16" rx="6" stroke="#93C5FD" />

  <!-- Content area grid: row 1 -->
  <rect x="100" y="124" width="148" height="100" rx="8" stroke="#60A5FA" />
  <rect x="260" y="124" width="152" height="100" rx="8" stroke="#60A5FA" />

  <!-- Content area grid: row 2 -->
  <rect x="100" y="236" width="100" height="108" rx="8" stroke="#93C5FD" />
  <rect x="212" y="236" width="96" height="52" rx="8" stroke="#93C5FD" />
  <rect x="320" y="236" width="92" height="52" rx="8" stroke="#93C5FD" />
  <rect x="212" y="300" width="200" height="44" rx="8" stroke="#93C5FD" />

  <!-- Content area grid: row 3 -->
  <rect x="100" y="356" width="312" height="72" rx="8" stroke="#94A3B8" />

  <!-- Grid separator lines for visual structure -->
  <line x1="100" y1="168" x2="232" y2="168" stroke="#93C5FD" stroke-width="1" opacity="0.4" />
  <line x1="260" y1="168" x2="396" y2="168" stroke="#93C5FD" stroke-width="1" opacity="0.4" />

  <!-- Corner accent nodes -->
  <circle cx="100" cy="124" r="4" fill="#2563EB" stroke="none" />
  <circle cx="396" cy="124" r="4" fill="#2563EB" stroke="none" />
  <circle cx="100" cy="412" r="4" fill="#2563EB" stroke="none" />
  <circle cx="396" cy="412" r="4" fill="#2563EB" stroke="none" />

  <!-- Cursor indicator in title bar -->
  <rect x="168" y="80" width="2" height="8" rx="1" fill="#2563EB" stroke="none" opacity="0.6" />
</svg>