<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Architecture Icon -->
  <g stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top layer -->
    <rect x="32" y="20" width="64" height="20" rx="4"/>
    <!-- Middle layer -->
    <rect x="20" y="54" width="88" height="20" rx="4" stroke="#60A5FA" stroke-opacity="0.6"/>
    <!-- Bottom layer -->
    <rect x="8" y="88" width="112" height="20" rx="4" stroke="#93C5FD" stroke-opacity="0.4"/>
    <!-- Connectors -->
    <line x1="64" y1="40" x2="64" y2="54" stroke-dasharray="3 2" stroke="#94A3B8" stroke-opacity="0.4"/>
    <line x1="64" y1="74" x2="64" y2="88" stroke-dasharray="3 2" stroke="#94A3B8" stroke-opacity="0.4"/>
    <!-- Nodes -->
    <circle cx="64" cy="40" r="2" fill="#2563EB" fill-opacity="0.5"/>
    <circle cx="64" cy="74" r="2" fill="#60A5FA" fill-opacity="0.5"/>
  </g>
</svg>
